name: Deploy Expo Web on GitHub Pages

on:
  push:
    branches: [ main, master ] # Dispara automaticamente ao enviar código
  workflow_dispatch: # Permite rodar a Action manualmente no site do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'MeuDinheiro/package-lock.json' # Ajuste o caminho se seu package.json estiver na raiz

      - name: Instalar dependências
        run: |
          cd MeuDinheiro
          npm ci

      - name: Gerar build da versão Web
        run: |
          cd MeuDinheiro
          npx expo export -p web

      - name: Configurar artefato das Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do build
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'MeuDinheiro/dist' # Pasta onde o Expo gera os arquivos da web

      - name: Fazer deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
