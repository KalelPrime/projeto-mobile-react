name: Deploy Expo Web on GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7  # 🌟 Atualizado de v4 para v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7  # 🌟 Atualizado de v4 para v7
        with:
          node-version: 20

      - name: Instalar dependências e Gerar Build
        run: |
          cd MeuDinheiro
          npm install
          npx expo export -p web

      - name: Configurar artefato das Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do build
        uses: actions/upload-pages-artifact@v4  # 🌟 Atualizado de v3 para v4
        with:
          path: 'MeuDinheiro/dist'

      - name: Fazer deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
